<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-label="04 — TELEMETRY">
<title>04 — TELEMETRY</title>
<style>@font-face{font-family:'Orb';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'Orb', 'Orbitron', 'Segoe UI', sans-serif;font-weight:800}
.m{font-family:'JBM', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-weight:400}
.mb{font-family:'JBM', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes run{0%{transform:translateX(0)}100%{transform:translateX(860px)}}
rect{transform-box:view-box}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A0E24"/><stop offset="1" stop-color="#04050D"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#8B5CFF"/><stop offset="1" stop-color="#FF2BD6" stop-opacity=".1"/></linearGradient>
<linearGradient id="pl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

<path d="M0.5 0.5H983.5L999.5 16.5V71.5H16.5L0.5 55.5Z" fill="url(#bg)" stroke="#1C2550"/>
<text x="28" y="44" class="d" font-size="18" fill="#FF2BD6" letter-spacing="2">04</text>
<text x="72" y="44" class="m" font-size="18" fill="#3A4677">//</text>
<text x="108" y="45" class="d" font-size="26" fill="#E6F1FF" letter-spacing="4" filter="url(#g)">TELEMETRY</text>
<text x="966" y="43" text-anchor="end" class="m" font-size="13" letter-spacing="3" fill="#8A9BC4">LIVE GITHUB SIGNAL</text>
<rect x="28" y="58" width="924" height="2" fill="url(#ln)" opacity=".8"/>
<rect x="28" y="56" width="90" height="6" fill="url(#pl)" opacity=".9" style="animation:run 5s ease-in-out infinite alternate"/>
<rect x="960" y="54" width="10" height="10" fill="none" stroke="#00F0FF" stroke-width="1.5" class="pulse"/>
</svg>
