<svg xmlns="http://www.w3.org/2000/svg" width="260" height="62" viewBox="0 0 260 62" role="img" aria-label="Portfolio">
<title>Portfolio</title>
<style>@font-face{font-family:'SG';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.s4{font-family:'SG', 'Space Grotesk', 'Segoe UI', sans-serif;font-weight:400}.s5{font-family:'SG', 'Space Grotesk', 'Segoe UI', sans-serif;font-weight:500}.s7{font-family:'SG', 'Space Grotesk', 'Segoe UI', sans-serif;font-weight:700}
.m4{font-family:'JBM', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-weight:400}.m7{font-family:'JBM', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes shine{0%{transform:translateX(-140px)}40%,100%{transform:translateX(300px)}}
.shine{animation:shine 4.5s ease-in-out infinite}</style>
<defs>
<linearGradient id="fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38E1FF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38E1FF" stop-opacity=".7"/><stop offset="1" stop-color="#8B7CFF" stop-opacity=".7"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="pill"><rect width="260" height="62" rx="31"/></clipPath></defs>
<rect width="260" height="62" rx="31" fill="url(#fill)"/>
<g clip-path="url(#pill)"><rect x="0" y="0" width="90" height="62" fill="url(#gloss)" class="shine"/></g>
<text x="74.5" y="38" class="s7" font-size="19" fill="#05060B">Portfolio</text>
<path d="M171.5 37L184.5 24M175.4 24H184.5V33.1" fill="none" stroke="#05060B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
