<svg xmlns="http://www.w3.org/2000/svg" width="260" height="58" viewBox="0 0 260 58" role="img" aria-label="EMAIL ME">
<title>EMAIL ME</title>
<style>@font-face{font-family:'Orb';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'Orb', 'Orbitron', 'Segoe UI', sans-serif;font-weight:800}
.m{font-family:'JBM', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-weight:400}
.mb{font-family:'JBM', 'JetBrains Mono', ui-monospace, Consolas, monospace;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.blink{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes sweep{to{stroke-dashoffset:-1000}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".16"/><stop offset="1" stop-color="#04050D"/></linearGradient><filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

<path d="M1 1H245L259 15V57H15L1 43Z" fill="#04050D"/>
<path d="M1 1H245L259 15V57H15L1 43Z" fill="url(#bg)" stroke="#FF2BD6" stroke-opacity=".8" stroke-width="1.5"/>
<path d="M1 1H245L259 15V57H15L1 43Z" fill="none" stroke="#FF2BD6" stroke-width="2.5" pathLength="1000" stroke-dasharray="80 920" filter="url(#g)" style="animation:sweep 4s linear infinite"/>
<text x="28" y="36" class="d" font-size="16" letter-spacing="4" fill="#E6F1FF">EMAIL ME</text>
<path d="M216 36L230 22M220.9 22H230V31.1" fill="none" stroke="#FF2BD6" stroke-width="2.2" stroke-linecap="square"/>
