name: Profile assets

on:
  schedule:
    # Refresh telemetry + snake daily, and re-verify every README image/link
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check committed SVGs match the generator
        run: |
          node scripts/build-assets.mjs
          git diff --exit-code -- assets || (echo "::error::assets/ is stale - run 'node scripts/build-assets.mjs' and commit" && exit 1)

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Optional PROFILE_TOKEN (a personal token) lets the snake and telemetry
          # include private contributions; GITHUB_TOKEN only sees public data.
          github_token: ${{ secrets.PROFILE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CFF&color_dots=#ebedf0,#c4f5ff,#7ce8ff,#00c8ff,#0090ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF2BD6&color_dots=#161b22,#0b3a5c,#007a9e,#00b8d9,#00f0ff

      - name: Generate telemetry panel
        run: node scripts/build-stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Publish to output branch
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every README image and link
        run: node scripts/check-readme.mjs
        env:
          OUTPUT_DIR: dist
