name: Profile assets

on:
  schedule:
    # Refresh telemetry + activity grid daily, and re-verify every README image/link
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check committed SVGs match the generator
        run: |
          node scripts/build-assets.mjs
          git diff --exit-code -- assets || (echo "::error::assets/ is stale - run 'node scripts/build-assets.mjs' and commit" && exit 1)

      - name: Generate telemetry panel and activity grid
        run: node scripts/build-stats.mjs dist
        env:
          # Optional PROFILE_TOKEN (a personal token) also counts private
          # contributions; GITHUB_TOKEN only sees public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Commit refreshed telemetry
        if: github.event_name != 'pull_request'
        run: |
          cp dist/stats.svg assets/telemetry.svg
          cp dist/activity.svg assets/activity.svg
          git add assets/telemetry.svg assets/activity.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh telemetry panel"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

      - name: Verify every README image and link
        run: node scripts/check-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
